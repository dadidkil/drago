# ─────────────────────────────────────────────────────────────────────────────
# ТОП «Драго» за nginx ISPmanager.
# Положить в: /etc/nginx/vhosts-resources/<домен>/drago-proxy.conf
# (ISPmanager подключает этот каталог в ОБА server{} сайта — 80 и 443 — директивой
#  include /etc/nginx/vhosts-resources/<домен>/*.conf; и не перезаписывает его при
#  изменении настроек сайта).
#
# Почему не «location /»: в сгенерированном ISPmanager конфиге уже есть location / c
# вложенными regex для статики (*.js, *.css, *.png…), которые перехватили бы файлы Next.js,
# а второй location / nginx не допускает. Поэтому на уровне server делаем внутренний
# rewrite в служебные location с ^~ и проксируем исходный $request_uri без изменений.
# ─────────────────────────────────────────────────────────────────────────────

set $drago_route "";
# Проксируем только HTTPS: HTTP-сервер ISPmanager сам редиректит на HTTPS.
if ($scheme = https) {
    set $drago_route "web";
}
# Callback API ВКонтакте → vk-bot
if ($request_uri ~ "^/vk/callback(\?|$)") {
    set $drago_route "${drago_route}vk";
}
# Служебные пути ISPmanager остаются за панелью: выпуск/продление сертификатов Let's Encrypt, веб-почта.
if ($request_uri ~ "^/(\.well-known/acme-challenge|roundcube|webmail|phpmyadmin)(/|$)") {
    set $drago_route "";
}
# www.<домен> → <домен> (только HTTPS и не для служебных путей): один адрес для cookie сессии и SEO.
set $drago_apex "";
if ($host ~* "^www\.(.+)$") {
    set $drago_apex $1;
}
if ($drago_route = "") {
    set $drago_apex "";
}
if ($drago_apex != "") {
    return 301 https://$drago_apex$request_uri;
}
if ($drago_route = "web") {
    rewrite ^ /__drago_web__ last;
}
if ($drago_route = "webvk") {
    rewrite ^ /__drago_vk__ last;
}

location ^~ /__drago_web__ {
    internal;
    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Перезаписываем (а не дополняем) X-Forwarded-For: nginx — первый узел, клиентские значения не доверяем
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_pass http://127.0.0.1:3000$request_uri;
}

location ^~ /__drago_vk__ {
    internal;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3002$request_uri;
}
